aid: civil-maps
name: Civil Maps
description: >-
  Civil Maps was a San Francisco autonomous-vehicle mapping company founded in 2015 by
  Sravan Puttagunta and Scott Harvey, with Fabien Chraim and Anuj Gupta on the founding
  team. It built AI software that turned vehicle LiDAR and camera data into machine-readable
  HD 3D maps and delivered real-time six-degrees-of-freedom localization at 15-20 cm
  absolute accuracy, crowdsourcing map updates from production fleets rather than from
  dedicated survey vehicles, and packaged that as the Atlas DevKit and Atlas Lite DevKit
  car-mounted units. It raised roughly USD 17 million across four rounds, including a
  USD 6.6 million seed led by Motus Ventures with Ford Motor Company, Wicklow Capital,
  StartX and AME Cloud Ventures, and was acquired by Luminar Technologies in mid-2022 -
  an acquisition Luminar announced at CES in January 2023 and folded into its Sentinel
  platform. Civil Maps no longer operates as an independent business: civilmaps.com is a
  frozen four-page marketing archive stamped "Copyright 2019" with no developer section,
  it publishes no developer portal, no API documentation and no machine-readable API
  contract, and its 2015-era GitHub organization holds five C++ repositories last pushed
  between 2017 and 2020.
