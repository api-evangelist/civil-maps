  it can be asserted against. Every API/protocol standard below is recorded as
  applicable:false rather than as a failure, so this file is never mistaken for a
  posture the company was measured on and fell short of. The company was absorbed into
  Luminar Technologies in mid-2022; any live conformance obligation now belongs to
  Luminar, not to this entity.
